name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Kairos.slnx

      - name: Build
        run: dotnet build Kairos.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Kairos.slnx --no-build --configuration Release
